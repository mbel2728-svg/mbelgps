if (act==="export-csv") {
      var vs = myVehicles();
      var csv = "CUSTOMER NAME,VEHICLE NUMBER,GPS IMEI,INSTALL DATE,VALIDITY YEARS,ODISHA PERMIT,ODISHA EXPIRY,CG PERMIT,CG EXPIRY,PHONE\n";
      for (var i=0; i<vs.length; i++) {
        var v = vs[i];
        csv += [v.customerName, v.vehicleNumber, v.gpsImei, v.gpsInstallDate, v.gpsValidityYears, v.odishaPermitNo, v.odishaExpiryDate, v.cgPermitNo, v.cgExpiryDate, v.customerPhone].join(",") + "\n";
      }
      var blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url;
      a.download = "VaahanDesk_Vehicles.csv";
      a.click();
      return;
    }
