<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0c0d0b" />
<title>VaahanDesk - GPS & Permit Management</title>
<style>
:root {
  --bg: #0c0d0b; --fg: #eceae4; --card: #151613; --muted: #9a978c;
  --line: #2a2b26; --btn: #d8d6cc; --ink: #12130f; --soft: #1c1d19; --radius: 14px;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--fg); font-family: "Segoe UI", system-ui, sans-serif; min-height: 100dvh; }
button, input, select { font: inherit; }
button, .btn, .chip { cursor: pointer; touch-action: manipulation; -webkit-tap-highlight-color: rgba(255,255,255,.1); }
.wrap { max-width: 900px; margin: 0 auto; padding: 20px 16px 100px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; margin-bottom: 12px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.grid { display: grid; gap: 12px; }
.g2 { grid-template-columns: 1fr; }
@media(min-width: 650px){ .g2 { grid-template-columns: 1fr 1fr; } .g4 { grid-template-columns: repeat(4, 1fr)!important; } }
.g4 { display: grid; gap: 10px; grid-template-columns: repeat(2, 1fr); }
label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; font-weight: 600; }
input, select { width: 100%; background: var(--soft); color: var(--fg); border: 1px solid var(--line); border-radius: 10px; padding: 12px; outline: none; }
input:focus, select:focus { border-color: var(--btn); }
.btn { display: inline-block; text-align: center; border: 0; border-radius: 10px; padding: 14px 16px; font-weight: 700; min-height: 48px; width: 100%; }
.btn-p { background: var(--btn); color: var(--ink); }
.btn-s { background: var(--soft); color: var(--fg); border: 1px solid var(--line); }
.btn-d { background: #3a1c18; color: #fde8e4; }
.btn-wa { background: #1f3d2c; color: #b7e0c2; text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 6px;}
.btn-row { display: flex; gap: 8px; }
.btn-row .btn { width: auto; flex: 1; }
.chip { border: 0; border-radius: 999px; padding: 10px 16px; background: var(--soft); color: var(--muted); min-height: 40px; font-weight: 600; font-size: 13px; }
.chip.on { background: var(--btn); color: var(--ink); }
.badge { display: inline-flex; border-radius: 999px; padding: 5px 12px; font-size: 11px; font-weight: 700; margin-top: 4px; }
.b-red, .b-expired { background: #3a1c18; color: #f0b8ae; }
.b-yellow { background: #322a14; color: #e8d09a; }
.b-green { background: #1a2a1c; color: #b5d7b7; }
.b-none { background: var(--soft); color: var(--muted); }
.stat { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; text-align: center; }
.stat b { display: block; font-size: 26px; margin-top: 2px; }
.nav { position: fixed; bottom: 0; left: 0; right: 0; background: #11120f; border-top: 1px solid var(--line); display: flex; justify-content: space-around; padding: 8px; z-index: 20; backdrop-filter: blur(10px); }
.nav button { background: none; border: 0; color: var(--muted); padding: 10px; font-size: 12px; font-weight: 600; }
.nav button.on { color: var(--fg); }
.err { background: #3a1c18; color: #f0b8ae; padding: 12px; border-radius: 10px; margin-bottom: 12px; font-size: 13px; }
.ok { background: #1a2a1c; color: #b5d7b7; padding: 12px; border-radius: 10px; margin-bottom: 12px; font-size: 13px; }
.plate { font-size: 20px; font-weight: 800; letter-spacing: 0.05em; font-family: monospace; }
h1 { font-size: 24px; margin: 0 0 4px; }
h2 { font-size: 18px; margin: 16px 0 10px; }
</style>
</head>
<body>
<div id="app" class="wrap">लोड हो रहा है…</div>

<script>
(function () {
  var KEY = "vaahandesk.v5";
  var page = "dash";
  var loginTab = "admin"; // 'admin' or 'customer'
  var editing = null;
  var filters = { q: "", svc: "all" };
  var msg = "", msgKind = "err";
  var generatedOtp = "";
  var pendingPhone = "";

  function loadDB() {
    try {
      var raw = localStorage.getItem(KEY);
      if (raw) return JSON.parse(raw);
    } catch (e) {}
    return { users: [], vehicles: [], session: null, role: "admin", lang: "hi" };
  }
  var DB = loadDB();
  function saveDB() { try { localStorage.setItem(KEY, JSON.stringify(DB)); } catch (e) {} }

  var T = {
    hi: {
      app: "VaahanDesk", tag: "GPS · ओडिशा · छत्तीसगढ़ माइनिंग डेस्क",
      shopAdmin: "दुकान / एडमिन", customerTrans: "ग्राहक / ट्रांसपोर्टर",
      email: "ईमेल", password: "पासवर्ड", shopName: "दुकान का नाम", signIn: "लॉगिन करें",
      demo: "डेमो खोलें (एक टैप)", dash: "डैशबोर्ड", vehicles: "गाड़ियाँ",
      settings: "सेटिंग्स", out: "लॉग आउट", total: "कुल गाड़ियाँ", red: "अलर्ट (लाल)",
      yellow: "अलर्ट (पीला)", expired: "समाप्त", attention: "तत्काल ध्यान दें",
      allClear: "सभी गाड़ियाँ सुरक्षित हैं!", add: "नई गाड़ी जोड़ें", sample: "डेमो डम्पर लोड करें",
      searchV: "गाड़ी नंबर या ग्राहक खोजें…", all: "सभी", gps: "GPS", odisha: "ओडिशा", cg: "छत्तीसगढ़",
      customerName: "ग्राहक का नाम", vehicleNumber: " गाड़ी नंबर", imei: "GPS IMEI (15 अंक)",
      install: "GPS इंस्टॉल तिथि", validity: "वैधता (साल)", gpsExp: "GPS समाप्ति",
      odPermit: "ओडिशा परमिट नं.", odExp: "ओडिशा समाप्ति", cgPermit: "छत्तीसगढ़ परमिट नं.",
      cgExp: "छत्तीसगढ़ समाप्ति", custPhone: "व्हाट्सएप मोबाइल नंबर", save: "सुरक्षित करें",
      cancel: "रद्द करें", del: "हटाएँ", edit: "संपादित करें", wa: "व्हाट्सएप भेजें",
      today: "आज समाप्त", none: "लागू नहीं", lang: "भाषा बदलें", saved: "सफलतापूर्वक सेव हो गया!",
      deleted: "हटा दिया गया", required: "कृपया सभी आवश्यक जानकारी भरें",
      mobileNum: "मोबाइल नंबर", sendOtp: "WhatsApp पर OTP भेजें", enterOtp: "4-अंकों का OTP दर्ज करें", verifyLogin: "OTP सत्यापित करके लॉगिन करें",
      otpSent: "WhatsApp के लिए OTP तैयार है! नीचे दिए गए लिंक से भेजें:"
    },
    en: {
      app: "VaahanDesk", tag: "GPS · Odisha · Chhattisgarh mining desk",
      shopAdmin: "Shop / Admin", customerTrans: "Customer / Transporter",
      email: "Email", password: "Password", shopName: "Shop Name", signIn: "Sign In",
      demo: "Open with Demo Data", dash: "Dashboard", vehicles: "Vehicles",
      settings: "Settings", out: "Sign Out", total: "Total Vehicles", red: "Red Alerts",
      yellow: "Yellow Alerts", expired: "Expired", attention: "Needs Attention",
      allClear: "All vehicles clear!", add: "Add Vehicle", sample: "Load Sample Dumpers",
      searchV: "Search vehicle or customer…", all: "All", gps: "GPS", odisha: "Odisha", cg: "Chhattisgarh",
      customerName: "Customer Name", vehicleNumber: "Vehicle Number", imei: "GPS IMEI (15 digits)",
      install: "GPS Install Date", validity: "Validity (Years)", gpsExp: "GPS Expiry",
      odPermit: "Odisha Permit No.", odExp: "Odisha Expiry", cgPermit: "Chhattisgarh Permit No.",
      cgExp: "Chhattisgarh Expiry", custPhone: "WhatsApp Mobile", save: "Save",
      cancel: "Cancel", del: "Delete", edit: "Edit", wa: "Send WhatsApp",
      today: "Expires Today", none: "Not Set", lang: "Language", saved: "Successfully saved!",
      deleted: "Deleted successfully", required: "Required fields are missing",
      mobileNum: "Mobile Number", sendOtp: "Send OTP via WhatsApp", enterOtp: "Enter 4-digit OTP", verifyLogin: "Verify & Login",
      otpSent: "OTP generated! Click below to send via WhatsApp:"
    }
  };
  function L() { return T[DB.lang] || T.hi; }
  function flash(t, k) { msg = t || ""; msgKind = k || "err"; }

  function todayIso() { return new Date().toISOString().slice(0,10); }
  function addYears(iso, y) {
    if (!iso || !y) return "";
    var p = iso.split("-").map(Number);
    var dt = new Date(Date.UTC(p[0]+y, p[1]-1, p[2]));
    return dt.toISOString().slice(0,10);
  }
  function daysUntil(iso) {
    if (!iso) return null;
    return Math.round((Date.parse(iso + "T00:00:00Z") - Date.parse(todayIso() + "T00:00:00Z")) / 86400000);
  }
  function level(d) {
    if (d === null) return "none";
    if (d < 0) return "expired";
    if (d <= 7) return "red";
    if (d <= 30) return "yellow";
    return "green";
  }
  function myVehicles() {
    var list = [];
    for (var i = 0; i < DB.vehicles.length; i++) {
      var v = DB.vehicles[i];
      if (DB.role === "admin") {
        list.push(v);
      } else {
        // Customer sees only vehicles matching their phone
        if (v.customerPhone === DB.session) list.push(v);
      }
    }
    return list;
  }
  function checkSnaps(v) {
    var t = L();
    var items = [
      { key: "gps", date: v.gpsExpiryDate, label: t.gps },
      { key: "odisha", date: v.odishaExpiryDate, label: t.odisha },
      { key: "cg", date: v.cgExpiryDate, label: t.cg }
    ];
    for (var i = 0; i < items.length; i++) {
      items[i].days = daysUntil(items[i].date);
      items[i].lv = level(items[i].days);
    }
    return items;
  }
  function worstLv(v) {
    var rank = { expired: 0, red: 1, yellow: 2, green: 3, none: 4 };
    var w = "none", snaps = checkSnaps(v);
    for (var i = 0; i < snaps.length; i++) {
      if (rank[snaps[i].lv] < rank[w]) w = snaps[i].lv;
    }
    return w;
  }
  function makeBadge(lv, days, name) {
    var t = L(), txt = t.none;
    if (days === 0) txt = t.today;
    else if (days !== null && days < 0) txt = Math.abs(days) + (DB.lang === "hi" ? " दिन ओवरड्यू" : " days overdue");
    else if (days !== null) txt = days + (DB.lang === "hi" ? " दिन शेष" : " days left");
    return '<span class="badge b-' + lv + '">' + name + ' · ' + txt + '</span>';
  }
  function waText(v, s) {
    var name = v.customerName || "";
    if (DB.lang === "hi") {
      var w = s.days < 0 ? (Math.abs(s.days) + " दिन पहले समाप्त हो चुकी है") : (s.days === 0 ? "आज समाप्त हो रही है" : (s.days + " दिन में समाप्त होगी (" + s.date + ")"));
      return "नमस्ते " + name + " जी,\nआपकी गाड़ी " + v.vehicleNumber + " की " + s.label + " वैधता " + w + "। कृपया समय पर रिन्यू कराएं।\n— VaahanDesk";
    }
    return "Hello " + name + ",\nVehicle " + v.vehicleNumber + " " + s.label + " expires in " + s.days + " days (" + s.date + "). Please renew.\n— VaahanDesk";
  }

  function renderLogin() {
    var t = L();
    return '<div style="max-width:400px; margin:30px auto;">' +
      '<h1 style="font-size:32px; margin-bottom:4px;">' + t.app + '</h1>' +
      '<p style="color:var(--muted); margin-bottom:16px;">' + t.tag + '</p>' +
      (msg ? '<div class="' + msgKind + '">' + msg + '</div>' : '') +
      '<button class="btn btn-p" data-act="demo" style="margin-bottom:14px;">' + t.demo + '</button>' +
      
      // Tabs
      '<div style="display:flex; gap:6px; margin-bottom:14px;">' +
        '<button class="chip ' + (loginTab === 'admin' ? 'on' : '') + '" data-tab="admin" style="flex:1;">' + t.shopAdmin + '</button>' +
        '<button class="chip ' + (loginTab === 'customer' ? 'on' : '') + '" data-tab="customer" style="flex:1;">' + t.customerTrans + '</button>' +
      '</div>' +

      (loginTab === 'admin' ? 
        '<div class="card grid">' +
          '<h2>' + t.shopAdmin + '</h2>' +
          '<div><label>' + t.shopName + '</label><input id="sName" value="MBEL GPS" /></div>' +
          '<div><label>' + t.email + '</label><input id="sEmail" value="admin@mbelgps.com" /></div>' +
          '<div><label>' + t.password + '</label><input id="sPass" type="password" value="123456" /></div>' +
          '<button class="btn btn-p" data-act="login-admin">' + t.signIn + '</button>' +
        '</div>' 
        : 
        '<div class="card grid">' +
          '<h2>' + t.customerTrans + '</h2>' +
          '<div><label>' + t.mobileNum + '</label><input id="custMob" placeholder="9876543210" value="' + pendingPhone + '" /></div>' +
          (!generatedOtp ? 
            '<button class="btn btn-p" data-act="send-otp">' + t.sendOtp + '</button>' :
            '<div><label>' + t.enterOtp + '</label><input id="custOtpInput" placeholder="4-digit OTP" /></div>' +
            '<button class="btn btn-p" data-act="verify-otp">' + t.verifyLogin + '</button>'
          ) +
        '</div>'
      ) +
    '</div>';
  }

  function renderDash() {
    var t = L(), vs = myVehicles();
    var red = 0, yellow = 0, expired = 0, alerts = [];

    for (var i = 0; i < vs.length; i++) {
      var w = worstLv(vs[i]);
      if (w === "red" || w === "expired") red++;
      if (w === "yellow") yellow++;
      if (w === "expired") expired++;

      var snaps = checkSnaps(vs[i]);
      for (var j = 0; j < snaps.length; j++) {
        if (snaps[j].days !== null && snaps[j].days <= 30) {
          alerts.push({ v: vs[i], s: snaps[j] });
        }
      }
    }
    alerts.sort(function(a, b) { return a.s.days - b.s.days; });

    var html = (msg ? '<div class="' + msgKind + '">' + msg + '</div>' : '') +
      '<h1>' + (DB.role === 'admin' ? 'नमस्ते, Admin' : 'नमस्ते, ग्राहक') + '</h1>' +
      '<p style="color:var(--muted);">' + t.tag + '</p>' +
      '<div class="g4" style="margin:16px 0;">' +
        '<div class="stat"><span style="color:var(--muted);font-size:12px">' + t.total + '</span><b>' + vs.length + '</b></div>' +
        '<div class="stat"><span style="color:var(--muted);font-size:12px">' + t.red + '</span><b style="color:#f0b8ae">' + red + '</b></div>' +
        '<div class="stat"><span style="color:var(--muted);font-size:12px">' + t.yellow + '</span><b style="color:#e8d09a">' + yellow + '</b></div>' +
        '<div class="stat"><span style="color:var(--muted);font-size:12px">' + t.expired + '</span><b style="color:#f0b8ae">' + expired + '</b></div>' +
      '</div>';

    if (vs.length === 0 && DB.role === 'admin') {
      html += '<button class="btn btn-s" data-act="load-sample" style="margin-bottom:16px;">' + t.sample + '</button>';
    }

    html += '<h2>' + t.attention + '</h2>';
    if (alerts.length === 0) {
      html += '<p style="color:var(--muted)">' + t.allClear + '</p>';
    } else {
      for (var k = 0; k < alerts.length; k++) {
        var item = alerts[k];
        var waLink = "https://wa.me/91" + item.v.customerPhone + "?text=" + encodeURIComponent(waText(item.v, item.s));
        html += '<div class="card">' +
          '<div style="display:flex; justify-content:space-between; align-items:center;">' +
            '<span class="plate">' + item.v.vehicleNumber + '</span>' +
            makeBadge(item.s.lv, item.s.days, item.s.label) +
          '</div>' +
          '<div style="color:var(--muted); font-size:13px; margin-top:4px;">' + item.v.customerName + '</div>' +
          (DB.role === 'admin' && item.v.customerPhone ? '<div style="margin-top:10px;"><a class="btn btn-wa" href="' + waLink + '" target="_blank">' + t.wa + '</a></div>' : '') +
        '</div>';
      }
    }
    return html;
  }

  function renderVehicles() {
    var t = L(), vs = myVehicles();
    var q = filters.q.toUpperCase();
    var html = (msg ? '<div class="' + msgKind + '">' + msg + '</div>' : '') +
      '<div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">' +
        '<h1>' + t.vehicles + '</h1>' +
        (DB.role === 'admin' ? '<button class="btn btn-p" data-act="start-add" style="width:auto;">+ ' + t.add + '</button>' : '') +
      '</div>' +
      '<input id="searchBox" placeholder="' + t.searchV + '" value="' + filters.q + '" style="margin-bottom:14px;" />' +
      '<div style="margin-bottom:14px;" class="row">' +
        '<button class="chip ' + (filters.svc === 'all' ? 'on' : '') + '" data-filter="all">' + t.all + '</button>' +
        '<button class="chip ' + (filters.svc === 'gps' ? 'on' : '') + '" data-filter="gps">GPS</button>' +
        '<button class="chip ' + (filters.svc === 'odisha' ? 'on' : '') + '" data-filter="odisha">' + t.odisha + '</button>' +
        '<button class="chip ' + (filters.svc === 'cg' ? 'on' : '') + '" data-filter="cg">' + t.cg + '</button>' +
      '</div>';

    var count = 0;
    for (var i = 0; i < vs.length; i++) {
      var v = vs[i];
      if (q && v.vehicleNumber.indexOf(q) === -1 && v.customerName.toUpperCase().indexOf(q) === -1) continue;
      count++;
      var snaps = checkSnaps(v);
      var badges = "";
      for (var j = 0; j < snaps.length; j++) {
        if (filters.svc === 'all' || filters.svc === snaps[j].key) {
          badges += makeBadge(snaps[j].lv, snaps[j].days, snaps[j].label) + " ";
        }
      }

      html += '<div class="card">' +
        '<div style="display:flex; justify-content:space-between; align-items:flex-start;">' +
          '<div>' +
            '<div class="plate">' + v.vehicleNumber + '</div>' +
            '<div style="color:var(--muted); font-size:13px;">' + v.customerName + (v.customerPhone ? ' · ' + v.customerPhone : '') + '</div>' +
          '</div>' +
          (DB.role === 'admin' ? 
            '<div class="btn-row" style="width:auto">' +
              '<button class="btn btn-s" data-act="edit" data-id="' + v.id + '" style="padding:8px 12px; min-height:36px;">' + t.edit + '</button>' +
              '<button class="btn btn-d" data-act="del" data-id="' + v.id + '" style="padding:8px 12px; min-height:36px;">' + t.del + '</button>' +
            '</div>' : ''
          ) +
        '</div>' +
        '<div style="margin-top:10px; display:flex; flex-wrap:wrap; gap:6px;">' + badges + '</div>' +
      '</div>';
    }
    if (count === 0) html += '<p style="color:var(--muted)">कोई गाड़ी नहीं मिली।</p>';
    return html;
  }

  function renderEditor() {
    var t = L();
    var x = editing || { customerName: "", vehicleNumber: "", gpsImei: "", gpsInstallDate: todayIso(), gpsValidityYears: 1, odishaPermitNo: "", odishaExpiryDate: "", cgPermitNo: "", cgExpiryDate: "", customerPhone: "" };
    var exp = addYears(x.gpsInstallDate, Number(x.gpsValidityYears) || 1);

    return (msg ? '<div class="' + msgKind + '">' + msg + '</div>' : '') +
      '<h1>' + (editing && editing.id ? t.edit : t.add) + '</h1>' +
      '<div class="card grid">' +
        '<div class="grid g2">' +
          '<div><label>' + t.customerName + '</label><input id="fName" value="' + (x.customerName || '') + '" /></div>' +
          '<div><label>' + t.vehicleNumber + '</label><input id="fVeh" value="' + (x.vehicleNumber || '') + '" /></div>' +
          '<div><label>' + t.imei + '</label><input id="fImei" value="' + (x.gpsImei || '') + '" maxlength="15" /></div>' +
          '<div><label>' + t.custPhone + '</label><input id="fPhone" value="' + (x.customerPhone || '') + '" /></div>' +
          '<div><label>' + t.install + '</label><input id="fInst" type="date" value="' + (x.gpsInstallDate || todayIso()) + '" /></div>' +
          '<div><label>' + t.validity + '</label><select id="fYears"><option value="1"' + (x.gpsValidityYears == 1 ? ' selected' : '') + '>1 Year</option><option value="2"' + (x.gpsValidityYears == 2 ? ' selected' : '') + '>2 Years</option><option value="3"' + (x.gpsValidityYears == 3 ? ' selected' : '') + '>3 Years</option><option value="5"' + (x.gpsValidityYears == 5 ? ' selected' : '') + '>5 Years</option></select></div>' +
          '<div><label>' + t.gpsExp + '</label><input id="fGpsExp" value="' + exp + '" disabled /></div><div></div>' +
          '<div><label>' + t.odPermit + '</label><input id="fOdNo" value="' + (x.odishaPermitNo || '') + '" /></div>' +
          '<div><label>' + t.odExp + '</label><input id="fOdExp" type="date" value="' + (x.odishaExpiryDate || '') + '" /></div>' +
          '<div><label>' + t.cgPermit + '</label><input id="fCgNo" value="' + (x.cgPermitNo || '') + '" /></div>' +
          '<div><label>' + t.cgExp + '</label><input id="fCgExp" type="date" value="' + (x.cgExpiryDate || '') + '" /></div>' +
        '</div>' +
        '<div class="btn-row" style="margin-top:12px;">' +
          '<button class="btn btn-p" data-act="save">' + t.save + '</button>' +
          '<button class="btn btn-s" data-act="cancel">' + t.cancel + '</button>' +
        '</div>' +
      '</div>';
  }

  function renderSettings() {
    var t = L();
    return (msg ? '<div class="' + msgKind + '">' + msg + '</div>' : '') +
      '<h1>' + t.settings + '</h1>' +
      '<div class="card">' +
        '<p style="color:var(--muted)">' + t.lang + '</p>' +
        '<div class="row">' +
          '<button class="chip ' + (DB.lang === 'hi' ? 'on' : '') + '" data-lang="hi">हिन्दी</button>' +
          '<button class="chip ' + (DB.lang === 'en' ? 'on' : '') + '" data-lang="en">English</button>' +
        '</div>' +
      '</div>' +
      '<button class="btn btn-d" data-act="logout" style="margin-top:20px;">' + t.out + '</button>';
  }

  function render() {
    var app = document.getElementById("app");
    var t = L();
    if (!DB.session) {
      app.innerHTML = renderLogin();
      return;
    }

    var content = "";
    if (page === "dash") content = renderDash();
    else if (page === "vehicles") content = renderVehicles();
    else if (page === "edit") content = renderEditor();
    else if (page === "settings") content = renderSettings();

    app.innerHTML = '<div style="padding-bottom:70px;">' + content + '</div>' +
      '<nav class="nav">' +
        '<button data-nav="dash" class="' + (page === 'dash' ? 'on' : '') + '">' + t.dash + '</button>' +
        '<button data-nav="vehicles" class="' + (page === 'vehicles' || page === 'edit' ? 'on' : '') + '">' + t.vehicles + '</button>' +
        '<button data-nav="settings" class="' + (page === 'settings' ? 'on' : '') + '">' + t.settings + '</button>' +
      '</nav>';
  }

  document.addEventListener("click", function(e) {
    var act = e.target.getAttribute("data-act");
    var nav = e.target.getAttribute("data-nav");
    var filt = e.target.getAttribute("data-filter");
    var lang = e.target.getAttribute("data-lang");
    var tab = e.target.getAttribute("data-tab");

    if (tab) { loginTab = tab; generatedOtp = ""; msg = ""; render(); }
    if (nav) { page = nav; editing = null; msg = ""; render(); }
    if (filt) { filters.svc = filt; render(); }
    if (lang) { DB.lang = lang; saveDB(); render(); }

    if (act === "demo") {
      DB.session = "admin";
      DB.role = "admin";
      saveDB();
      page = "dash";
      flash(L().saved, "ok");
      render();
    }

    if (act === "login-admin") {
      DB.session = "admin";
      DB.role = "admin";
      saveDB();
      page = "dash";
      flash(L().saved, "ok");
      render();
    }

    if (act === "send-otp") {
      var phone = document.getElementById("custMob").value.trim();
      if (!phone || phone.length < 10) { flash(L().required, "err"); render(); return; }
      pendingPhone = phone;
      generatedOtp = Math.floor(1000 + Math.random() * 9000).toString();
      
      var waUrl = "https://wa.me/91" + phone + "?text=" + encodeURIComponent("आपका VaahanDesk लॉगिन OTP है: " + generatedOtp);
      window.open(waUrl, "_blank");
      
      flash(L().otpSent + " OTP: " + generatedOtp, "ok");
      render();
    }

    if (act === "verify-otp") {
      var entered = document.getElementById("custOtpInput").value.trim();
      if (entered === generatedOtp) {
        DB.session = pendingPhone;
        DB.role = "customer";
        saveDB();
        page = "dash";
        flash(L().saved, "ok");
      } else {
        flash("गलत OTP दर्ज किया गया!", "err");
      }
      render();
    }

    if (act === "load-sample") {
      var samples = [
        { id: "1", customerName: "राम ट्रांसपोर्ट", vehicleNumber: "OD05AB4521", gpsImei: "869451032211547", gpsInstallDate: todayIso(), gpsValidityYears: 1, gpsExpiryDate: addYears(todayIso(), 1), odishaPermitNo: "OD-8821", odishaExpiryDate: addYears(todayIso(), 0), cgPermitNo: "CG-4410", cgExpiryDate: addYears(todayIso(), 1), customerPhone: "9876500101" },
        { id: "2", customerName: "शुभम माइनिंग", vehicleNumber: "CG04CD8890", gpsImei: "869451032211548", gpsInstallDate: todayIso(), gpsValidityYears: 2, gpsExpiryDate: addYears(todayIso(), 2), odishaPermitNo: "", odishaExpiryDate: "", cgPermitNo: "CG-2291", cgExpiryDate: addYears(todayIso(), 0), customerPhone: "9876500102" }
      ];
      DB.vehicles = DB.vehicles.concat(samples);
      saveDB();
      flash(L().saved, "ok");
      render();
    }

    if (act === "start-add") {
      editing = { customerName: "", vehicleNumber: "", gpsImei: "", gpsInstallDate: todayIso(), gpsValidityYears: 1, odishaPermitNo: "", odishaExpiryDate: "", cgPermitNo: "", cgExpiryDate: "", customerPhone: "" };
      page = "edit";
      msg = "";
      render();
    }

    if (act === "edit") {
      var id = e.target.getAttribute("data-id");
      for (var i = 0; i < DB.vehicles.length; i++) {
        if (DB.vehicles[i].id === id) editing = DB.vehicles[i];
      }
      page = "edit";
      msg = "";
      render();
    }

    if (act === "del") {
      var id = e.target.getAttribute("data-id");
      var keep = [];
      for (var i = 0; i < DB.vehicles.length; i++) {
        if (DB.vehicles[i].id !== id) keep.push(DB.vehicles[i]);
      }
      DB.vehicles = keep;
      saveDB();
      flash(L().deleted, "ok");
      render();
    }

    if (act === "save") {
      var t = L();
      var name = document.getElementById("fName").value.trim();
      var veh = document.getElementById("fVeh").value.trim().toUpperCase();
      if (!name || !veh) { flash(t.required, "err"); render(); return; }

      var record = {
        id: editing && editing.id ? editing.id : Date.now().toString(36),
        customerName: name,
        vehicleNumber: veh,
        gpsImei: document.getElementById("fImei").value.trim(),
        customerPhone: document.getElementById("fPhone").value.trim(),
        gpsInstallDate: document.getElementById("fInst").value,
        gpsValidityYears: Number(document.getElementById("fYears").value),
        gpsExpiryDate: addYears(document.getElementById("fInst").value, Number(document.getElementById("fYears").value)),
        odishaPermitNo: document.getElementById("fOdNo").value.trim(),
        odishaExpiryDate: document.getElementById("fOdExp").value,
        cgPermitNo: document.getElementById("fCgNo").value.trim(),
        cgExpiryDate: document.getElementById("fCgExp").value
      };

      if (editing && editing.id) {
        for (var i = 0; i < DB.vehicles.length; i++) {
          if (DB.vehicles[i].id === record.id) DB.vehicles[i] = record;
        }
      } else {
        DB.vehicles.push(record);
      }
      saveDB();
      editing = null;
      page = "vehicles";
      flash(t.saved, "ok");
      render();
    }

    if (act === "cancel") {
      editing = null;
      page = "vehicles";
      msg = "";
      render();
    }

    if (act === "logout") {
      DB.session = null;
      DB.role = "admin";
      generatedOtp = "";
      saveDB();
      render();
    }
  });

  document.addEventListener("input", function(e) {
    if (e.target.id === "searchBox") {
      filters.q = e.target.value;
      render();
    }
    if (e.target.id === "fInst" || e.target.id === "fYears") {
      var dt = document.getElementById("fInst").value;
      var yrs = Number(document.getElementById("fYears").value) || 1;
      var exp = document.getElementById("fGpsExp");
      if (exp) exp.value = addYears(dt, yrs);
    }
  });

  render();
})();
</script>
</body>
</html>
