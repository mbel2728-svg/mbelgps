<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MBELGPS - गाड़ियाँ</title>
    <!-- SheetJS Library Excel Export ke liye -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #fff;
            margin: 0;
            padding: 20px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 10px;
        }
        h1 { margin: 0; font-size: 24px; }
        .btn-container {
            display: flex;
            gap: 10px;
        }
        .btn {
            background-color: #2e7d32;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
        }
        .btn:hover { background-color: #388e3c; }
        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .search-box input {
            background-color: #1e1e1e;
            border: 1px solid #333;
            color: #fff;
            padding: 10px;
            border-radius: 5px;
            flex: 1;
            min-width: 200px;
        }
        .filters {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .filter-btn {
            background-color: #1e1e1e;
            color: #fff;
            border: 1px solid #333;
            padding: 8px 15px;
            border-radius: 20px;
            cursor: pointer;
        }
        .filter-btn.active {
            background-color: #333;
        }
        .vehicle-card {
            background-color: #1e1e1e;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }
        .vehicle-info h3 { margin: 0 0 5px 0; color: #fff; font-size: 18px; }
        .vehicle-info p { margin: 0 0 10px 0; color: #aaa; font-size: 14px; }
        .badges {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .badge {
            padding: 5px 10px;
            border-radius: 5px;
            font-size: 12px;
            font-weight: bold;
        }
        .badge-gps { background-color: #3d341a; color: #ffca28; }
        .badge-odisha { background-color: #4a1515; color: #ef5350; }
        .badge-cg { background-color: #1b381e; color: #66bb6a; }
        .card-actions {
            display: flex;
            gap: 8px;
        }
        .action-btn {
            padding: 8px 12px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 13px;
            font-weight: bold;
        }
        .btn-edit { background-color: #2b2b2b; color: #fff; }
        .btn-delete { background-color: #421818; color: #ff8a80; }
    </style>
</head>
<body>

    <div class="header">
        <h1>गाड़ियाँ</h1>
        <div class="btn-container">
            <button class="btn">➕ नई गाड़ी</button>
            <!-- Excel Export Button -->
            <button class="btn" onclick="exportToExcel()">📥 गाड़ियाँ एक्सपोर्ट करें (Excel)</button>
            <button class="btn">📤 गाड़ियाँ इम्पोर्ट करें (Excel)</button>
        </div>
    </div>

    <div class="search-box">
        <input type="text" placeholder="गाड़ी नंबर...">
        <input type="text" placeholder="ग्राहक का नाम...">
    </div>

    <div class="filters">
        <button class="filter-btn active">सभी</button>
        <button class="filter-btn">GPS</button>
        <button class="filter-btn">ओडिशा</button>
        <button class="filter-btn">छत्तीसगढ़</button>
        <button class="filter-btn">केवल लाल अलर्ट</button>
    </div>

    <!-- Vehicle List Container -->
    <div id="vehicleContainer">
        <div class="vehicle-card">
            <div class="vehicle-info">
                <h3>OD05AB4521</h3>
                <p>राम ट्रांसपोर्ट · 9876500101</p>
                <div class="badges">
                    <span class="badge badge-gps">GPS · 25 दिन शेष</span>
                    <span class="badge badge-odisha">ओडिशा · 5 दिन शेष</span>
                    <span class="badge badge-cg">छत्तीसगढ़ · 48 दिन शेष</span>
                </div>
            </div>
            <div class="card-actions">
                <button class="action-btn btn-edit">संपादित</button>
                <button class="action-btn btn-delete">हटाएँ</button>
            </div>
        </div>

        <div class="vehicle-card">
            <div class="vehicle-info">
                <h3>CG04CD8890</h3>
                <p>शुभम माइनिंग · 9876500102</p>
                <div class="badges">
                    <span class="badge badge-gps">GPS · 30 दिन शेष</span>
                    <span class="badge badge-odisha" style="background-color:#2a2a2a; color:#aaa;">ओडिशा · सेट नहीं</span>
                    <span class="badge badge-odisha" style="background-color:#4a1515; color:#ef5350;">छत्तीसगढ़ · 3 दिन हो चुके</span>
                </div>
            </div>
            <div class="card-actions">
                <button class="action-btn btn-edit">संपादित</button>
                <button class="action-btn btn-delete">हटाएँ</button>
            </div>
        </div>
    </div>

    <script>
        // Sample vehicles array jise Excel me export kiya jayega
        const vehiclesList = [
            {
                "गाड़ी नंबर": "OD05AB4521",
                "ग्राहक का नाम": "राम ट्रांसपोर्ट",
                "मोबाइल नंबर": "9876500101",
                "GPS स्थिति": "25 दिन शेष",
                "ओडिशा स्थिति": "5 दिन शेष",
                "छत्तीसगढ़ स्थिति": "48 दिन शेष"
            },
            {
                "गाड़ी नंबर": "CG04CD8890",
                "ग्राहक का नाम": "शुभम माइनिंग",
                "मोबाइल नंबर": "9876500102",
                "GPS स्थिति": "30 दिन शेष",
                "ओडिशा स्थिति": "सेट नहीं",
                "छत्तीसगढ़ स्थिति": "3 दिन हो चुके"
            }
        ];

        // Excel Export Function
        function exportToExcel() {
            if (typeof vehiclesList === 'undefined' || vehiclesList.length === 0) {
                alert("Export karne ke liye koi data available nahi hai!");
                return;
            }

            // Data ko Excel sheet me convert karna
            const worksheet = XLSX.utils.json_to_sheet(vehiclesList);
            const workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, worksheet, "Gadiyan Data");
            
            // Excel file (.xlsx) download trigger karna
            XLSX.writeFile(workbook, "MBELGPS_Gadiyan_Data.xlsx");
        }
    </script>

</body>
</html>
