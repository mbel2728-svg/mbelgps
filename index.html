<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VaahanDesk - GPS · ओडिशा · छत्तीसगढ़ माइनिंग डेस्क</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0b0b0b; color: #ffffff; display: flex; height: 100vh; overflow: hidden; }
        
        /* Left Branding Panel */
        .left-panel { flex: 1; background: #0b0b0b; padding: 40px; display: flex; flex-direction: column; justify-content: space-between; border-right: 1px solid #222; }
        .logo-area { display: flex; align-items: center; gap: 12px; }
        .logo-icon { background: #1f1f1f; padding: 10px; border-radius: 8px; display: flex; align-items: center; justify-content: center; }
        .logo-text { font-size: 20px; font-weight: bold; letter-spacing: 0.5px; }
        
        .hero-text h1 { font-size: 48px; font-weight: 700; margin-bottom: 10px; }
        .hero-text p { font-size: 18px; color: #a0a0a0; }
        
        .footer-info { font-size: 14px; color: #777; }

        /* Right Auth Panel */
        .right-panel { width: 480px; background: #0b0b0b; padding: 40px; display: flex; flex-direction: column; justify-content: center; }
        
        .role-tabs { display: flex; background: #161616; border-radius: 8px; padding: 4px; margin-bottom: 25px; border: 1px solid #262626; }
        .role-tab { flex: 1; text-align: center; padding: 10px; font-size: 14px; font-weight: 600; cursor: pointer; border-radius: 6px; color: #888; transition: 0.2s; }
        .role-tab.active { background: #e5e5e5; color: #000; }

        .social-btn { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #333; background: #141414; color: #fff; font-size: 14px; font-weight: 500; cursor: pointer; margin-bottom: 12px; display: flex; align-items: center; justify-content: center; gap: 10px; transition: 0.2s; }
        .social-btn:hover { background: #1f1f1f; }

        .divider { text-align: center; color: #666; font-size: 13px; margin: 15px 0; }

        .input-group { margin-bottom: 15px; }
        .input-group label { display: block; font-size: 13px; color: #bbb; margin-bottom: 6px; }
        .input-group input { width: 100%; padding: 12px; background: #141414; border: 1px solid #333; border-radius: 8px; color: #fff; font-size: 14px; outline: none; }
        .input-group input:focus { border-color: #666; }

        .submit-btn { width: 100%; padding: 12px; background: #e5e5e5; color: #000; font-size: 15px; font-weight: 600; border: none; border-radius: 8px; cursor: pointer; margin-top: 10px; transition: 0.2s; }
        .submit-btn:hover { background: #ffffff; }

        .auth-footer { text-align: center; margin-top: 20px; font-size: 14px; color: #888; }
        .auth-footer a { color: #fff; text-decoration: none; font-weight: 500; }
        .auth-footer a:hover { text-decoration: underline; }

        .lang-options { display: flex; gap: 8px; margin-top: 30px; }
        .lang-btn { padding: 6px 14px; background: #141414; border: 1px solid #333; border-radius: 6px; color: #aaa; font-size: 13px; cursor: pointer; }
        .lang-btn.active { background: #262626; color: #fff; }

        @media(max-width: 900px) {
            body { flex-direction: column; overflow: auto; height: auto; }
            .left-panel { display: none; }
            .right-panel { width: 100%; padding: 20px; }
        }
    </style>
</head>
<body>

    <!-- Left Branding Section -->
    <div class="left-panel">
        <div class="logo-area">
            <div class="logo-icon">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M5 18H3c-.6 0-1-.4-1-1V7c0-.6.4-1 1-1h10c.6 0 1 .4 1 1v11"></path><path d="M14 9h4l4 4v4c0 .6-.4 1-1 1h-2"></path><circle cx="7" cy="18" r="2"></circle><circle cx="17" cy="18" r="2"></circle></svg>
            </div>
            <span class="logo-text">VaahanDesk</span>
        </div>
        <div class="hero-text">
            <h1>VaahanDesk</h1>
            <p>GPS · ओडिशा · छत्तीसगढ़ माइनिंग डेस्क</p>
        </div>
        <div class="footer-info">
            GPS · Odisha · Chhattisgarh
        </div>
    </div>

    <!-- Right Login Section -->
    <div class="right-panel">
        <div class="role-tabs">
            <div class="role-tab active">दुकान / एडमिन</div>
            <div class="role-tab">ग्राहक / ट्रांसपोर्टर</div>
        </div>

        <button class="social-btn">
            <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#EA4335" d="M12 5c1.6 0 3 .6 4.1 1.6l3.1-3.1C17.3 1.8 14.8 1 12 1 7.5 1 3.7 3.6 1.8 7.3l3.7 2.9C6.4 7.2 9 5 12 5z"/><path fill="#4285F4" d="M23.5 12.3c0-.8-.1-1.6-.2-2.3H12v4.5h6.5c-.3 1.5-1.1 2.8-2.4 3.7l3.7 2.9c2.2-2 3.7-5 3.7-8.8z"/><path fill="#FBBC05" d="M5.5 14.8c-.2-.7-.4-1.5-.4-2.3s.2-1.6.4-2.3L1.8 7.3C.7 9.5 0 12 0 14.5s.7 5 1.8 7.2l3.7-2.9z"/><path fill="#34A853" d="M12 23c3.2 0 6-1.1 8-3l-3.7-2.9c-1.1.7-2.5 1.2-4.3 1.2-3 0-5.6-2.2-6.5-5.2L1.8 16c1.9 3.7 5.7 7 10.2 7z"/></svg>
            Google से जारी रखें
        </button>

        <button class="social-btn">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="#fff"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
            X से जारी रखें
        </button>

        <div class="divider">या दुकान ईमेल</div>

        <div class="input-group">
            <label>ईमेल</label>
            <input type="email" placeholder="name@example.com">
        </div>

        <div class="input-group">
            <label>पासवर्ड</label>
            <input type="password" placeholder="••••••••">
        </div>

        <button class="submit-btn">लॉगिन</button>

        <div class="auth-footer">
            नई दुकान? <a href="#">खाता बनाएँ</a>
        </div>

        <div class="lang-options">
            <button class="lang-btn active">हिन्दी</button>
            <button class="lang-btn">English</button>
        </div>
    </div>

</body>
</html>
