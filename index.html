<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0c0d0b" />
<title>VaahanDesk</title>
<!-- SheetJS Library for Excel Export/Import -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root {
  --bg:#0c0d0b; --fg:#eceae4; --card:#151613; --muted:#9a978c;
  --line:#2a2b26; --btn:#d8d6cc; --ink:#12130f; --soft:#1c1d19; --radius:12px;
}
* { box-sizing:border-box; }
html, body { margin:0; background:var(--bg); color:var(--fg);
  font-family:"Segoe UI","Nirmala UI",system-ui,sans-serif; min-height:100dvh; }
h1,h2,.plate { font-family:Rajdhani,"Segoe UI",sans-serif; }
button, input, select { font:inherit; }
button, .btn, .chip { cursor:pointer; touch-action:manipulation; -webkit-tap-highlight-color:rgba(255,255,255,.12); }
.wrap { max-width:980px; margin:0 auto; padding:20px 16px 110px; }
.card { background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:16px; }
.row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
.grid { display:grid; gap:10px; }
.g2 { grid-template-columns:1fr; }
@media(min-width:700px){ .g2{ grid-template-columns:1fr 1fr; } .g4{ grid-template-columns:repeat(4,1fr)!important; } }
.g4 { display:grid; gap:10px; grid-template-columns:repeat(2,1fr); }
label { display:block; font-size:12px; color:var(--muted); margin-bottom:4px; }
input, select {
  width:100%; background:var(--soft); color:var(--fg); border:1px solid var(--line);
  border-radius:8px; padding:12px; outline:none;
}
.btn { display:inline-block; text-align:center; text-decoration:none; border:0; border-radius:10px;
  padding:14px 16px; font-weight:700; min-height:48px; width:100%; }
.btn-p { background:var(--btn); color:var(--ink); }
.btn-s { background:var(--soft); color:var(--fg); border:1px solid var(--line); }
.btn-d { background:#3a1c18; color:#fde8e4; }
.btn-wa { background:#1f3d2c; color:#b7e0c2; }
.btn-row { display:flex; gap:8px; }
.btn-row .btn { width:auto; flex:1; }
.chip { border:0; border-radius:999px; padding:10px 14px; background:var(--soft); color:var(--muted); min-height:40px; }
.chip.on { background:var(--btn); color:var(--ink); }
.badge { display:inline-flex; border-radius:999px; padding:4px 10px; font-size:12px; font-weight:700; }
.b-red,.b-expired { background:#3a1c18; color:#f0b8ae; }
.b-yellow { background:#322a14; color:#e8d09a; }
.b-green { background:#1a2a1c; color:#b5d7b7; }
.b-none { background:var(--soft); color:var(--muted); }
.stat { background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:14px; }
.stat b { display:block; font-size:28px; }
.nav { position:fixed; bottom:0; left:0; right:0; background:#11120f; border-top:1px solid var(--line);
  display:flex; justify-content:space-around; padding:6px 6px calc(8px + env(safe-area-inset-bottom)); z-index:20; }
.nav button { background:none; border:0; color:var(--muted); padding:12px 8px; font-size:12px; min-width:64px; }
.nav button.on { color:var(--fg); font-weight:700; }
.hide { display:none !important; }
.muted { color:var(--muted); font-size:13px; }
.err { background:#3a1c18; color:#f0b8ae; padding:12px; border-radius:8px; margin:10px 0; }
.ok { background:#1a2a1c; color:#b5d7b7; padding:12px; border-radius:8px; margin:10px 0; }
.plate { letter-spacing:.04em; font-size:22px; font-weight:700; }
</style>
</head>
<body>
<div id="app" class="wrap">Loading…</div>
<script>
(function () {
  var KEY = "vaahandesk.v4";
  var mem = null;
  var page = "dash";
  var editing = null;
  var filters = { q: "", cq: "", svc: "all", status: "all" };
  var msg = "";
  var msgKind = "err";

  function empty() { return { users: [], vehicles: [], session: null, alertDays: [30, 15, 7, 0] }; }
  function load() {
    if (mem) return mem;
    try {
      var raw = localStorage.getItem(KEY);
      if (raw) return JSON.parse(raw);
    } catch (e) {}
    return empty();
  }
  function persist() {
    try { localStorage.setItem(KEY, JSON.stringify(DB)); } catch (e) { mem = DB; }
  }
  var DB = load();

  var TXT = {
    app:"VaahanDesk", tag:"GPS · Odisha · Chhattisgarh Mining Desk",
    shop:"Shop / Admin", customer:"Customer / Transporter",
    email:"Email", password:"Password", shopName:"Shop Name",
    signIn:"Sign In", createShop:"Create Shop", phone:"Mobile Number",
    demo:"Open Demo (One Tap)",
    customerHint:"Get mobile + password from the shop.",
    dash:"Dashboard", vehicles:"Vehicles", customers:"Customers", settings:"Settings",
    out:"Sign Out", total:"Total Vehicles", red:"Red Alerts", yellow:"Yellow Alerts", expired:"Expired",
    attention:"Needs Attention", allClear:"No active alerts.",
    add:"Add Vehicle", sample:"Load Sample Vehicles", searchV:"Search vehicle number…", searchC:"Search customer name…",
    all:"All", gps:"GPS", odisha:"OD Mining", cg:"CG Mining", redOnly:"Red Alerts Only",
    customerName:"CUSTOMER NAME", vehicleNumber:"VEHICLE NUMBER", imei:"GPS IMEI",
    install:"GPS INSTALLATION DATE", validity:"GPS Validity (Years)",
    gpsExp:"GPS EXPIRY DATE", odExp:"OD MINING EXPIRY DATE",
    cgExp:"CG MINING EXPIRY DATE",
    custPhone:"MOBILE NUMBER", save:"Save", cancel:"Cancel", del:"Delete", edit:"Edit",
    wa:"WhatsApp Reminder", today:"Expires Today", none:"Not set",
    createLogin:"Create Login", custHelp:"Customer logs in with mobile and password.",
    shopRole:"Shop Admin", custRole:"Customer",
    alert:"Alert Thresholds", greet:"Hello", share:"Send Login on WhatsApp",
    needShop:"Create a shop first or open demo.", badLogin:"Incorrect email or password.",
    badCust:"Incorrect mobile or password.", pwMin:"Password must be at least 6 characters.",
    required:"Customer Name and Vehicle Number are required.", badImei:"IMEI must be 15 digits.", badPhone:"Enter a valid 10-digit mobile number.",
    dupV:"This vehicle number already exists.", dupP:"This mobile number already exists.", saved:"Successfully saved.",
    created:"Successfully created.", deleted:"Successfully deleted.", viewOnly:"View only.",
    exportExcel:"Export Vehicles (Excel)",
    importExcel:"Import Vehicles (Excel)"
  };

  function T() { return TXT; }
  function flash(text, kind) { msg = text || ""; msgKind = kind || "err"; }
  function banner() {
    if (!msg) return "";
    return '<div class="' + (msgKind === "ok" ? "ok" : "err") + '">' + esc(msg) + "</div>";
  }
  function todayIso() {
    var n = new Date();
    return n.getFullYear() + "-" + String(n.getMonth()+1).padStart(2,"0") + "-" + String(n.getDate()).padStart(2,"0");
  }
  function addYears(iso, years) {
    if (!iso || !years) return "";
    var p = iso.split("-").map(Number);
    if (p.length < 3 || isNaN(p[0])) return "";
    var dt = new Date(Date.UTC(p[0], p[1]-1, p[2]));
    dt.setUTCFullYear(dt.getUTCFullYear() + years);
    return dt.toISOString().slice(0,10);
  }
  function daysUntil(iso) {
    if (!iso) return null;
    var a = Date.parse(iso + "T00:00:00Z");
    var b = Date.parse(todayIso() + "T00:00:00Z");
    if (isNaN(a) || isNaN(b)) return null;
    return Math.round((a-b)/86400000);
  }
  function level(days) {
    if (days === null) return "none";
    if (days < 0) return "expired";
    if (days <= 7) return "red";
    if (days <= 30) return "yellow";
    return "green";
  }
  function digits(s) { return String(s||"").replace(/\D/g,""); }
  
  // Helper to parse dates flexibly (handles DD/MM/YYYY, Excel serial numbers, YYYY-MM-DD)
  function parseDate(val) {
    if (!val) return "";
    val = String(val).trim();
    if (val.indexOf('/') >= 0) {
      var parts = val.split('/');
      if (parts.length === 3) {
        var d = parts[0].padStart(2, '0');
        var m = parts[1].padStart(2, '0');
        var y = parts[2];
        if (y.length === 2) y = "20" + y;
        return y + "-" + m + "-" + d;
      }
    }
    // Handle Excel serial date number
    if (!isNaN(val) && Number(val) > 30000) {
      var utc_days = Math.floor(Number(val) - 25569);
      var utc_value = utc_days * 86400;
      var date_info = new Date(utc_value * 1000);
      return date_info.toISOString().slice(0, 10);
    }
    return val;
  }

  // Helper to fix scientific notation IMEI (e.g. 8.63725E+14)
  function parseImei(val) {
    if (!val) return "";
    var s = String(val).trim();
    if (s.indexOf('E') >= 0 || s.indexOf('e') >= 0) {
      var num = Number(s);
      if (!isNaN(num)) {
        return Math.round(num).toString();
      }
    }
    return digits(s);
  }

  function phone10(s) {
    var d = digits(s);
    if (d.length === 12 && d.indexOf("91") === 0) return d.slice(2);
    if (d.length === 11 && d.charAt(0) === "0") return d.slice(1);
    return d.length === 10 ? d : "";
  }
  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
  function me() {
    for (var i=0;i<DB.users.length;i++) if (DB.users[i].id === DB.session) return DB.users[i];
    return null;
  }
  function myVehicles() {
    var u = me(); if (!u) return [];
    var oid = u.role === "admin" ? u.id : u.ownerId;
    var out = [];
    for (var i=0;i<DB.vehicles.length;i++) {
      var v = DB.vehicles[i];
      if (v.ownerId !== oid) continue;
      if (u.role === "admin" || v.customerPhone === u.phone || v.customerUserId === u.id) out.push(v);
    }
    return out;
  }
  function snaps(v) {
    var list = [
      { key:"gps", date:v.gpsExpiryDate, label:"GPS Expiry" },
      { key:"odisha", date:v.odishaExpiryDate, label:"OD Mining Expiry" },
      { key:"chhattisgarh", date:v.cgExpiryDate, label:"CG Mining Expiry" }
    ];
    for (var i=0;i<list.length;i++) {
      list[i].days = daysUntil(list[i].date);
      list[i].lv = level(list[i].days);
    }
    return list;
  }
  function worst(v) {
    var rank = { expired:0, red:1, yellow:2, green:3, none:4 };
    var w = "none", s = snaps(v);
    for (var i=0;i<s.length;i++) if (rank[s[i].lv] < rank[w]) w = s[i].lv;
    return w;
  }
  function badge(lv, days, name) {
    var txt = "Not set";
    if (days === 0) txt = "Expires today";
    else if (days !== null && days < 0) txt = Math.abs(days) + " days overdue";
    else if (days !== null) txt = days + " days left";
    return '<span class="badge b-'+lv+'">'+name+' · '+txt+'</span>';
  }
  function waMsg(v, s) {
    var d = s.days, name = v.customerName || "";
    var when = d < 0 ? ("expired " + Math.abs(d) + " days ago") : (d === 0 ? "expires today" : ("expires in " + d + " days (" + s.date + ")"));
    return "Hello " + name + ",\nVehicle " + v.vehicleNumber + " " + s.label + " " + when + ".\nPlease renew on time.\n— VaahanDesk";
  }
  function waHref(phone, text) {
    var p = phone10(phone);
    if (!p) return "";
    return "https://wa.me/91" + p + "?text=" + encodeURIComponent(text);
  }
  function shift(days) {
    var p = todayIso().split("-").map(Number);
    var dt = new Date(Date.UTC(p[0],p[1]-1,p[2]));
    dt.setUTCDate(dt.getUTCDate()+days);
    return dt.toISOString().slice(0,10);
  }
  function samples() {
    return [
      {customerName:"Ram Transport",vehicleNumber:"OD05AB4521",gpsImei:"869451032211547",gpsInstallDate:shift(-340),gpsValidityYears:1,odishaExpiryDate:shift(5),cgExpiryDate:shift(48),customerPhone:"9876500101"},
      {customerName:"Shubham Mining",vehicleNumber:"CG04CD8890",gpsImei:"869451032211548",gpsInstallDate:shift(-700),gpsValidityYears:2,odishaExpiryDate:"",cgExpiryDate:shift(-3),customerPhone:"9876500102"},
      {customerName:"Jai Jagannath Transport",vehicleNumber:"OD09EF2211",gpsImei:"869451032211549",gpsInstallDate:shift(-20),gpsValidityYears:1,odishaExpiryDate:shift(14),cgExpiryDate:shift(21),customerPhone:"9876500103"},
      {customerName:"Bastar Logistics",vehicleNumber:"CG07GH3344",gpsImei:"869451032211550",gpsInstallDate:shift(-80),gpsValidityYears:1,odishaExpiryDate:shift(62),cgExpiryDate:shift(0),customerPhone:"9876500104"},
      {customerName:"Mahalaxmi Dumper",vehicleNumber:"OD11JK7788",gpsImei:"869451032211551",gpsInstallDate:shift(-400),gpsValidityYears:2,odishaExpiryDate:shift(-12),cgExpiryDate:"",customerPhone:"9876500105"},
      {customerName:"Sai Mining",vehicleNumber:"CG10LM9901",gpsImei:"869451032211552",gpsInstallDate:shift(-10),gpsValidityYears:1,odishaExpiryDate:shift(90),cgExpiryDate:shift(11),customerPhone:"9876500106"}
    ];
  }
  function esc(s) {
    return String(s||"").replace(/[&<>"']/g, function(c){
      if (c==="&") return "&"+"amp;";
      if (c==="<") return "&"+"lt;";
      if (c===">") return "&"+"gt;";
      if (c==='"') return "&"+"quot;";
      return "&#39;";
    });
  }
  function val(id) { var el = document.getElementById(id); return el ? el.value : ""; }

  function upsert(ownerId, raw, id) {
    var L = T();
    var vehicleNumber = String(raw.vehicleNumber||"").trim().toUpperCase().replace(/\s+/g,"");
    var customerName = String(raw.customerName||"").trim();
    if (!vehicleNumber || !customerName) throw new Error(L.required);
    
    var imei = parseImei(raw.gpsImei);
    if (imei && imei.length !== 15) {
      // If IMEI is close to 15 digits or slightly off during import, let it pass or pad/truncate gently instead of throwing hard error, or keep standard check:
      if (imei.length < 15) imei = imei.padEnd(15, '0');
      else if (imei.length > 15) imei = imei.slice(0, 15);
    }

    var phone = String(raw.customerPhone||"").trim() ? phone10(raw.customerPhone) : "";
    var years = Number(raw.gpsValidityYears)||1;
    var install = parseDate(raw.gpsInstallDate);
    
    // Fallback if installation date is empty but GPS expiry is given
    var gpsExpiry = parseDate(raw.gpsExpiryDate);
    if (!gpsExpiry && install && years) {
      gpsExpiry = addYears(install, years);
    } else if (!install && gpsExpiry && years) {
      // If installation date is missing, estimate it backwards from expiry
      var p = gpsExpiry.split("-").map(Number);
      if (p.length === 3) {
        var dt = new Date(Date.UTC(p[0], p[1]-1, p[2]));
        dt.setUTCFullYear(dt.getUTCFullYear() - years);
        install = dt.toISOString().slice(0,10);
      }
    }

    var cust = null;
    for (var i=0;i<DB.users.length;i++) {
      var x = DB.users[i];
      if (x.ownerId===ownerId && x.role==="customer" && x.phone===phone) cust = x;
    }
    for (var j=0;j<DB.vehicles.length;j++) {
      var vv = DB.vehicles[j];
      if (vv.ownerId===ownerId && vv.vehicleNumber===vehicleNumber && vv.id!==id) throw new Error(L.dupV);
    }
    var rec = {
      id: id || uid(), ownerId: ownerId, customerUserId: cust ? cust.id : null,
      customerName: customerName, vehicleNumber: vehicleNumber, gpsImei: imei,
      gpsInstallDate: install, gpsValidityYears: years||null, gpsExpiryDate: gpsExpiry,
      odishaExpiryDate: parseDate(raw.odishaExpiryDate),
      cgExpiryDate: parseDate(raw.cgExpiryDate),
      customerPhone: phone
    };
    var found = -1;
    for (var k=0;k<DB.vehicles.length;k++) if (DB.vehicles[k].id===rec.id) found = k;
    if (found>=0) DB.vehicles[found] = rec; else DB.vehicles.push(rec);
    persist();
  }

  function exportToExcel() {
    var list = myVehicles();
    if (!list || list.length === 0) {
      flash("No vehicle data available to export!");
      render();
      return;
    }
    var exportData = list.map(function(v) {
      return {
        "CUSTOMER NAME": v.customerName || "",
        "MOBILE NUMBER": v.customerPhone || "",
        "VEHICLE NUMBER": v.vehicleNumber || "",
        "GPS IMEI": v.gpsImei || "",
        "GPS INSTALLATION DATE": v.gpsInstallDate || "",
        "GPS EXPIRY DATE": v.gpsExpiryDate || "",
        "OD MINING EXPIRY DATE": v.odishaExpiryDate || "",
        "CG MINING EXPIRY DATE": v.cgExpiryDate || ""
      };
    });
    var worksheet = XLSX.utils.json_to_sheet(exportData);
    var workbook = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(workbook, worksheet, "Vehicles");
    XLSX.writeFile(workbook, "VaahanDesk_Vehicles.xlsx");
  }

  function importFromExcel(e) {
    var file = e.target.files[0];
    if (!file) return;
    
    flash("⏳ Importing vehicles, please wait...", "ok");
    render();

    var reader = new FileReader();
    reader.onload = function(evt) {
      try {
        var data = new Uint8Array(evt.target.result);
        var workbook = XLSX.read(data, {type: 'array'});
        var firstSheetName = workbook.SheetNames[0];
        var worksheet = workbook.Sheets[firstSheetName];
        var json = XLSX.utils.sheet_to_json(worksheet, {raw: false});
        var admin = me();
        if (!admin || admin.role !== "admin") return;
        var count = 0;
        for (var i = 0; i < json.length; i++) {
          var row = json[i];
          var raw = {
            customerName: row["CUSTOMER NAME"] || row["customerName"] || row["ग्राहक का नाम"] || "",
            customerPhone: row["MOBILE NUMBER"] || row["customerPhone"] || row["मोबाइल नंबर"] || "",
            vehicleNumber: row["VEHICLE NUMBER"] || row["vehicleNumber"] || row["गाड़ी नंबर"] || "",
            gpsImei: row["GPS IMEI"] || row["gpsImei"] || "",
            gpsInstallDate: row["GPS INSTALLATION DATE"] || row["gpsInstallDate"] || row["GPS इंस्टॉल तिथि"] || "",
            gpsValidityYears: row["GPS Validity (Years)"] || row["gpsValidityYears"] || row["GPS वैधता (वर्ष)"] || 1,
            gpsExpiryDate: row["GPS EXPIRY DATE"] || row["gpsExpiryDate"] || "",
            odishaExpiryDate: row["OD MINING EXPIRY DATE"] || row["odishaExpiryDate"] || row["ओडिशा समाप्ति तिथि"] || "",
            cgExpiryDate: row["CG MINING EXPIRY DATE"] || row["cgExpiryDate"] || row["छत्तीसगढ़ समाप्ति तिथि"] || ""
          };
          try {
            upsert(admin.id, raw);
            count++;
          } catch(err) {}
        }
        flash("✅ " + count + " vehicles imported successfully!", "ok");
        render();
      } catch (err) {
        flash("❌ Error reading Excel file! Please check headers.");
        render();
      }
    };
    reader.readAsArrayBuffer(file);
  }

  function openDemo() {
    var admin = null;
    for (var i=0;i<DB.users.length;i++) if (DB.users[i].email==="demo@vaahandesk.local") admin = DB.users[i];
    if (!admin) {
      admin = { id: uid(), role:"admin", name:"MBEL GPS", email:"demo@vaahandesk.local", password:"demo123", phone:null, ownerId:null };
      admin.ownerId = admin.id;
      DB.users.push(admin);
    }
    var has = false;
    for (var j=0;j<DB.vehicles.length;j++) if (DB.vehicles[j].ownerId===admin.id) has = true;
    if (!has) {
      var s = samples();
      for (var k=0;k<s.length;k++) upsert(admin.id, s[k]);
    }
    DB.session = admin.id;
    persist();
    page = "dash";
    flash("Demo loaded successfully · Login: demo@vaahandesk.local / demo123", "ok");
    render();
  }

  function loginView() {
    var L = T();
    return '<div style="max-width:440px;margin:32px auto">'+
      '<h1 style="font-size:42px;margin:0">'+L.app+'</h1>'+
      '<p class="muted">'+L.tag+'</p>'+banner()+
      '<button type="button" class="btn btn-p" data-act="demo" style="margin:12px 0">'+L.demo+'</button>'+
      '<div class="row" style="margin:12px 0">'+
        '<button type="button" class="chip on" data-act="tab-shop" id="tabShop">'+L.shop+'</button>'+
        '<button type="button" class="chip" data-act="tab-cust" id="tabCust">'+L.customer+'</button>'+
      '</div>'+
      '<div id="shopForm" class="card grid">'+
        '<div><label>'+L.shopName+'</label><input id="shopName" value="MBEL GPS" /></div>'+
        '<div><label>'+L.email+'</label><input id="shopEmail" value="shop@mbelgps.com" /></div>'+
        '<div><label>'+L.password+'</label><input id="shopPass" type="password" value="123456" /></div>'+
        '<button type="button" class="btn btn-p" data-act="shop-login">'+L.signIn+'</button>'+
        '<button type="button" class="btn btn-s" data-act="shop-create">'+L.createShop+'</button>'+
      '</div>'+
      '<div id="custForm" class="card grid hide">'+
        '<p class="muted">'+L.customerHint+'</p>'+
        '<div><label>'+L.phone+'</label><input id="custPhone" inputmode="numeric" placeholder="9876543210" /></div>'+
        '<div><label>'+L.password+'</label><input id="custPass" type="password" /></div>'+
        '<button type="button" class="btn btn-p" data-act="cust-login">'+L.signIn+'</button>'+
      '</div></div>';
  }

  function dashView(u) {
    var L = T(), vs = myVehicles(), red=0, yellow=0, expired=0, i;
    for (i=0;i<vs.length;i++) {
      var w = worst(vs[i]);
      if (w==="red"||w==="expired") red++;
      if (w==="yellow") yellow++;
      if (w==="expired") expired++;
    }
    var max = 30;
    for (i=0;i<(DB.alertDays||[]).length;i++) if (DB.alertDays[i]>max) max=DB.alertDays[i];
    if ((DB.alertDays||[]).length) max = Math.max.apply(null, DB.alertDays);
    var att = [];
    for (i=0;i<vs.length;i++) {
      var s = snaps(vs[i]).filter(function(x){ return x.days!==null && x.days<=max; }).sort(function(a,b){ return a.days-b.days; });
      if (s.length) att.push({ v:vs[i], s:s, soon:s[0] });
    }
    att.sort(function(a,b){ return a.soon.days-b.soon.days; });
    var html = banner()+'<h1 style="margin:0 0 4px">'+L.greet+(u.name?(", "+esc(u.name)):"")+'</h1>'+
      '<p class="muted">'+(u.role==="admin"?L.shopRole:L.custRole)+(u.role==="admin"?"":" · "+L.viewOnly)+'</p>'+
      '<div class="g4" style="margin:16px 0">'+
        '<div class="stat"><span class="muted">'+L.total+'</span><b>'+vs.length+'</b></div>'+
        '<div class="stat"><span class="muted">'+L.red+'</span><b style="color:#f0b8ae">'+red+'</b></div>'+
        '<div class="stat"><span class="muted">'+L.yellow+'</span><b style="color:#e8d09a">'+yellow+'</b></div>'+
        '<div class="stat"><span class="muted">'+L.expired+'</span><b style="color:#f0b8ae">'+expired+'</b></div></div>';
    if (u.role==="admin" && vs.length===0) html += '<button type="button" class="btn btn-s" data-act="sample">'+L.sample+'</button>';
    html += '<h2>'+L.attention+'</h2>';
    if (!att.length) html += '<p class="muted">'+L.allClear+'</p>';
    for (i=0;i<att.length;i++) {
      var item = att[i], badges="", href=waHref(item.v.customerPhone, waMsg(item.v, item.soon));
      for (var b=0;b<item.s.length;b++) badges += badge(item.s[b].lv,item.s[b].days,item.s[b].label)+" ";
      html += '<div class="card" style="margin-bottom:10px"><div class="plate">'+esc(item.v.vehicleNumber)+'</div>'+
        '<div class="muted">'+esc(item.v.customerName)+'</div>'+
        '<div class="row" style="margin-top:8px">'+badges+'</div>'+
        (href?'<p style="margin:10px 0 0"><a class="btn btn-wa" href="'+href+'">'+L.wa+'</a></p>':'')+
        '</div>';
    }
    return html;
  }

  function vehiclesView(u) {
    var L = T(), list = myVehicles(), i;
    var q = (filters.q||"").trim().toUpperCase();
    var cq = (filters.cq||"").trim().toLowerCase();
    var out = [];
    for (i=0;i<list.length;i++) {
      var v = list[i];
      if (q && v.vehicleNumber.indexOf(q)<0) continue;
      if (cq && String(v.customerName).toLowerCase().indexOf(cq)<0) continue;
      if (filters.svc!=="all") {
        var sn = snaps(v), ok=false;
        for (var s=0;s<sn.length;s++) if (sn[s].key===filters.svc && sn[s].lv!=="none" && sn[s].lv!=="green") ok=true;
        if (!ok) continue;
      }
      if (filters.status==="red") { var w=worst(v); if (w!=="red"&&w!=="expired") continue; }
      out.push(v);
    }
    
    var html = banner()+'<div class="row" style="justify-content:space-between"><h1 style="margin:0">'+L.vehicles+'</h1>'+
      (u.role==="admin" ? '<div class="row" style="gap:6px">' +
        '<button type="button" class="btn btn-s" data-act="addv" style="width:auto">'+L.add+'</button>' +
        '<button type="button" class="btn btn-s" data-act="export-excel" style="width:auto">📥 '+L.exportExcel+'</button>' +
        '<label class="btn btn-p" style="width:auto; cursor:pointer; margin:0; display:inline-flex; align-items:center;">📤 '+L.importExcel+'<input type="file" id="excelFileIn" accept=".xlsx, .xls, .csv" style="display:none" /></label>' +
        '</div>' : '') + '</div>'+
      '<div class="grid g2" style="margin:12px 0">'+
        '<input id="qV" placeholder="'+L.searchV+'" value="'+esc(filters.q)+'" />'+
        '<input id="qC" placeholder="'+L.searchC+'" value="'+esc(filters.cq)+'" /></div>'+
      '<div class="row">'+
        chip("svc","all",L.all)+chip("svc","gps",L.gps)+chip("svc","odisha",L.odisha)+chip("svc","chhattisgarh",L.cg)+
        '<button type="button" class="chip '+(filters.status==="red"?"on":"")+'" data-act="st-red">'+L.redOnly+'</button></div><div style="margin-top:12px">';
    
    if (!out.length) html += '<p class="muted">'+L.vehicles+': 0</p>';
    for (i=0;i<out.length;i++) {
      var vv = out[i], bd="";
      var ss = snaps(vv);
      for (var k=0;k<ss.length;k++) bd += badge(ss[k].lv,ss[k].days,ss[k].label)+" ";
      html += '<div class="card" style="margin-bottom:10px"><div class="row" style="justify-content:space-between">'+
        '<div class="plate">'+esc(vv.vehicleNumber)+'</div>'+
        (u.role==="admin"?'<div class="btn-row" style="width:auto"><button type="button" class="btn btn-s" data-act="edit" data-id="'+vv.id+'">'+L.edit+'</button>'+
        '<button type="button" class="btn btn-d" data-act="delv" data-id="'+vv.id+'">'+L.del+'</button></div>':'')+
        '</div><div class="muted">'+esc(vv.customerName)+(vv.customerPhone?(" · "+vv.customerPhone):"")+'</div>'+
        '<div class="row" style="margin-top:8px">'+bd+'</div></div>';
    }
    html += '</div><div id="editor"></div>';
    return html;
  }
  function chip(kind, key, label) {
    var on = (kind==="svc" && filters.svc===key) ? "on" : "";
    return '<button type="button" class="chip '+on+'" data-act="svc" data-id="'+key+'">'+label+'</button>';
  }
  function formHtml(v) {
    var L = T();
    var x = v || { customerName:"", vehicleNumber:"", gpsImei:"", gpsInstallDate:"", gpsValidityYears:1, odishaExpiryDate:"", cgExpiryDate:"", customerPhone:"" };
    var exp = addYears(x.gpsInstallDate, Number(x.gpsValidityYears)||0);
    var yrs = [1,2,3,5], opts="";
    for (var i=0;i<yrs.length;i++) opts += '<option value="'+yrs[i]+'" '+(Number(x.gpsValidityYears)===yrs[i]?"selected":"")+'>'+yrs[i]+'</option>';
    return '<div class="card" style="margin-top:16px"><div class="grid g2">'+
      '<div><label>'+L.customerName+'</label><input id="fName" value="'+esc(x.customerName)+'" /></div>'+
      '<div><label>'+L.vehicleNumber+'</label><input id="fVeh" value="'+esc(x.vehicleNumber)+'" /></div>'+
      '<div><label>'+L.imei+'</label><input id="fImei" value="'+esc(x.gpsImei)+'" maxlength="15" /></div>'+
      '<div><label>'+L.custPhone+'</label><input id="fPhone" value="'+esc(x.customerPhone)+'" /></div>'+
      '<div><label>'+L.install+'</label><input id="fInst" type="date" value="'+(x.gpsInstallDate||"")+'" /></div>'+
      '<div><label>'+L.validity+'</label><select id="fYears">'+opts+'</select></div>'+
      '<div><label>'+L.gpsExp+'</label><input id="fGpsExp" value="'+exp+'" disabled /></div><div></div>'+
      '<div><label>'+L.odExp+'</label><input id="fOdExp" type="date" value="'+(x.odishaExpiryDate||"")+'" /></div>'+
      '<div><label>'+L.cgExp+'</label><input id="fCgExp" type="date" value="'+(x.cgExpiryDate||"")+'" /></div>'+
      '</div><div class="btn-row" style="margin-top:12px">'+
      '<button type="button" class="btn btn-p" data-act="savev">'+L.save+'</button>'+
      '<button type="button" class="btn btn-s" data-act="cancelv">'+L.cancel+'</button></div></div>';
  }
  function customersView(u) {
    var L = T(), html = banner()+'<h1>'+L.customers+'</h1><p class="muted">'+L.custHelp+'</p>'+
      '<div class="card grid" style="margin:12px 0"><div class="grid g2">'+
      '<div><label>'+L.customerName+'</label><input id="cName" /></div>'+
      '<div><label>'+L.phone+'</label><input id="cPhone" inputmode="numeric" /></div>'+
      '<div><label>'+L.password+'</label><input id="cPass" /></div></div>'+
      '<button type="button" class="btn btn-p" data-act="make-cust">'+L.createLogin+'</button></div>';
    for (var i=0;i<DB.users.length;i++) {
      var c = DB.users[i];
      if (c.role!=="customer" || c.ownerId!==u.id) continue;
      var n=0;
      for (var j=0;j<DB.vehicles.length;j++) {
        var v=DB.vehicles[j];
        if (v.ownerId===u.id && (v.customerUserId===c.id || v.customerPhone===c.phone)) n++;
      }
      var text = "VaahanDesk login details:\nMobile: " + c.phone + "\nPassword: (Provided by shop)";
      var href = waHref(c.phone, text);
      html += '<div class="card" style="margin-bottom:8px"><b>'+esc(c.name)+'</b> · '+c.phone+' · '+n+' '+L.vehicles+
        '<div class="btn-row" style="margin-top:8px">'+(href?'<a class="btn btn-wa" href="'+href+'">'+L.share+'</a>':'')+
        '<button type="button" class="btn btn-d" data-act="delc" data-id="'+c.id+'">'+L.del+'</button></div></div>';
    }
    return html;
  }
  function settingsView(u) {
    var L = T(), days=[30,15,7,3,1,0], chips="";
    for (var i=0;i<days.length;i++) {
      var on = (DB.alertDays||[]).indexOf(days[i])>=0 ? "on":"";
      chips += '<button type="button" class="chip '+on+'" data-act="day" data-id="'+days[i]+'">'+(days[i]===0?"Today":days[i]+" Days")+'</button>';
    }
    return banner()+'<h1>'+L.settings+'</h1><p class="muted">'+(u.role==="admin"?L.shopRole:L.custRole)+' · '+esc(u.name||u.email||u.phone||"")+'</p>'+
      (u.role==="admin"?'<div class="card" style="margin-top:12px"><h2 style="margin-top:0">'+L.alert+'</h2><div class="row">'+chips+'</div></div>':'')+
      '<p style="margin-top:16px"><button type="button" class="btn btn-s" data-act="out">'+L.out+'</button></p>';
  }

  function render() {
    var u = me();
    var root = document.getElementById("app");
    var L = T();
    if (!u) { root.innerHTML = loginView(); return; }
    var body = page==="vehicles" ? vehiclesView(u) : page==="customers" && u.role==="admin" ? customersView(u) : page==="settings" ? settingsView(u) : dashView(u);
    root.innerHTML = body +
      '<nav class="nav">'+
      '<button type="button" data-act="go" data-id="dash" class="'+(page==="dash"?"on":"")+'">'+L.dash+'</button>'+
      '<button type="button" data-act="go" data-id="vehicles" class="'+(page==="vehicles"?"on":"")+'">'+L.vehicles+'</button>'+
      (u.role==="admin"?'<button type="button" data-act="go" data-id="customers" class="'+(page==="customers"?"on":"")+'">'+L.customers+'</button>':'')+
      '<button type="button" data-act="go" data-id="settings" class="'+(page==="settings"?"on":"")+'">'+L.settings+'</button></nav>';
    if (editing && page==="vehicles") {
      var ed = document.getElementById("editor");
      if (ed) ed.innerHTML = formHtml(editing.id ? editing : null);
    }
    var fileInput = document.getElementById("excelFileIn");
    if (fileInput) {
      fileInput.onchange = importFromExcel;
    }
  }

  function findUser(pred) {
    for (var i=0;i<DB.users.length;i++) if (pred(DB.users[i])) return DB.users[i];
    return null;
  }

  function onAct(act, el) {
    var L = T();
    msg = "";
    if (act==="demo") return openDemo();
    if (act==="export-excel") return exportToExcel();
    if (act==="tab-shop") {
      document.getElementById("shopForm").classList.remove("hide");
      document.getElementById("custForm").classList.add("hide");
      document.getElementById("tabShop").classList.add("on");
      document.getElementById("tabCust").classList.remove("on");
      return;
    }
    if (act==="tab-cust") {
      document.getElementById("custForm").classList.remove("hide");
      document.getElementById("shopForm").classList.add("hide");
      document.getElementById("tabCust").classList.add("on");
      document.getElementById("tabShop").classList.remove("on");
      return;
    }
    if (act==="shop-create" || act==="shop-login") {
      var name = (val("shopName")||"").trim() || "MBEL GPS";
      var email = (val("shopEmail")||"").trim().toLowerCase();
      var pass = val("shopPass");
      if (!email) { flash(L.required); return render(); }
      if (!pass || pass.length<6) { flash(L.pwMin); return render(); }
      var u = findUser(function(x){ return x.role==="admin" && x.email===email; });
      if (act==="shop-create") {
        if (u) { flash(L.dupP); return render(); }
        u = { id:uid(), role:"admin", name:name, email:email, password:pass, phone:null, ownerId:null };
        u.ownerId = u.id;
        DB.users.push(u);
      } else {
        if (!u) {
          u = { id:uid(), role:"admin", name:name, email:email, password:pass, phone:null, ownerId:null };
          u.ownerId = u.id;
          DB.users.push(u);
        } else if (u.password !== pass) { flash(L.badLogin); return render(); }
      }
      DB.session = u.id; persist(); page="dash"; flash(L.created,"ok"); return render();
    }
    if (act==="cust-login") {
      var phone = phone10(val("custPhone"));
      var p2 = val("custPass");
      var c = findUser(function(x){ return x.role==="customer" && x.phone===phone && x.password===p2; });
      if (!c) { flash(L.badCust); return render(); }
      DB.session=c.id; persist(); page="dash"; return render();
    }
    if (act==="go") { page = el.getAttribute("data-id"); editing=null; return render(); }
    if (act==="sample") {
      var admin = me(); var s=samples();
      for (var i=0;i<s.length;i++) { try { upsert(admin.id, s[i]); } catch(e) {} }
      flash(L.created,"ok"); return render();
    }
    if (act==="addv") { editing = {}; page="vehicles"; render(); document.getElementById("editor").innerHTML = formHtml(null); return; }
    if (act==="svc") { filters.svc = el.getAttribute("data-id"); return render(); }
    if (act==="st-red") { filters.status = filters.status==="red"?"all":"red"; return render(); }
    if (act==="edit") {
      var id = el.getAttribute("data-id");
      var vs = myVehicles();
      for (var i=0;i<vs.length;i++) if (vs[i].id===id) editing = vs[i];
      render(); return;
    }
    if (act==="delv") {
      var id = el.getAttribute("data-id");
      DB.vehicles = DB.vehicles.filter(function(x){ return x.id!==id; });
      persist(); flash(L.deleted,"ok"); return render();
    }
    if (act==="savev") {
      var admin = me();
      var raw = {
        customerName: val("fName"),
        vehicleNumber: val("fVeh"),
        gpsImei: val("fImei"),
        customerPhone: val("fPhone"),
        gpsInstallDate: val("fInst"),
        gpsValidityYears: val("fYears"),
        odishaExpiryDate: val("fOdExp"),
        cgExpiryDate: val("fCgExp")
      };
      try {
        upsert(admin.id, raw, editing && editing.id ? editing.id : null);
        editing = null; flash(L.saved, "ok"); render();
      } catch (err) {
        flash(err.message); render();
      }
      return;
    }
    if (act==="cancelv") { editing = null; render(); return; }
    if (act==="make-cust") {
      var admin = me();
      var cname = (val("cName")||"").trim();
      var cphone = phone10(val("cPhone"));
      var cpass = (val("cPass")||"").trim();
      if (!cname || !cphone || !cpass) { flash(L.required); return render(); }
      var exist = findUser(function(x){ return x.role==="customer" && x.ownerId===admin.id && x.phone===cphone; });
      if (exist) { flash(L.dupP); return render(); }
      var cu = { id:uid(), role:"customer", name:cname, email:null, password:cpass, phone:cphone, ownerId:admin.id };
      DB.users.push(cu);
      persist(); flash(L.created, "ok"); render();
      return;
    }
    if (act==="delc") {
      var cid = el.getAttribute("data-id");
      DB.users = DB.users.filter(function(x){ return x.id!==cid; });
      persist(); flash(L.deleted, "ok"); render();
      return;
    }
    if (act==="day") {
      var d = Number(el.getAttribute("data-id"));
      var idx = (DB.alertDays||[]).indexOf(d);
      if (idx>=0) DB.alertDays.splice(idx,1); else DB.alertDays.push(d);
      persist(); render(); return;
    }
    if (act==="out") { DB.session=null; persist(); page="dash"; editing=null; render(); return; }
  }

  document.addEventListener("click", function(e) {
    var t = e.target;
    while (t && t !== document) {
      var act = t.getAttribute("data-act");
      if (act) {
        onAct(act, t);
        break;
      }
      t = t.parentNode;
    }
  });

  document.addEventListener("input", function(e) {
    if (e.target.id === "qV") {
      filters.q = e.target.value;
      render();
    }
    if (e.target.id === "qC") {
      filters.cq = e.target.value;
      render();
    }
    if (e.target.id === "fInst" || e.target.id === "fYears") {
      var inst = val("fInst");
      var yrs = Number(val("fYears")) || 1;
      var expEl = document.getElementById("fGpsExp");
      if (expEl && inst) {
        expEl.value = addYears(inst, yrs);
      }
    }
  });

  render();
})();
</script>
</body>
</html>
